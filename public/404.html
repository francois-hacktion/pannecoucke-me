<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page introuvable · François Pannecoucke</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <meta name="theme-color" content="#f5f3ee" />
  <script>
    try { if (localStorage.getItem('resume-theme') === 'dark') document.documentElement.classList.add('dark') } catch (e) {}
  </script>
  <style>
    @font-face { font-family: 'Geist'; font-weight: 400 800; font-display: swap; src: url('/fonts/geist-latin.woff2') format('woff2'); }
    @font-face { font-family: 'Geist Mono'; font-weight: 400 700; font-display: swap; src: url('/fonts/geist-mono-latin.woff2') format('woff2'); }
    :root { --desk: #f5f3ee; --content: #fff; --ink: #0d1f2d; --body: #2b5170; --eyebrow: #7a6216; --border: rgba(26, 58, 82, .22); --rule: rgba(26, 58, 82, .12); }
    .dark { --desk: #0d1f2d; --content: #13293b; --ink: #f5f3ee; --body: #c9d5de; --eyebrow: #e6cc75; --border: rgba(255, 255, 255, .1); --rule: rgba(255, 255, 255, .1); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--desk); color: var(--body); font-family: 'Geist', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    main { width: 100%; max-width: 560px; padding: clamp(24px, 6vw, 48px); border-radius: 10px; border: 1px solid var(--border); background: var(--content); box-shadow: 0 1px 2px rgba(13, 31, 45, .06), 0 24px 48px -16px rgba(13, 31, 45, .22); }
    p { margin: 0; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 500; color: var(--eyebrow); margin-bottom: 14px; }
    .eyebrow::before { content: '#'; content: '#' / ''; color: #d4af37; font-weight: 700; margin-right: 8px; }
    h1 { margin: 0 0 12px; font-size: 32px; line-height: 1.15; letter-spacing: -0.02em; color: var(--ink); }
    .en { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--rule); }
    .en h1 { font-size: 22px; }
    a.button { display: inline-block; margin-top: 18px; padding: 12px 24px; border: 2px solid #000; border-radius: 4px; background: #d4af37; color: #0d1f2d; font-weight: 700; text-decoration: none; box-shadow: 4px 4px 0 0 #1a3a52; transition: transform 150ms, box-shadow 150ms; }
    a.button:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 0 #1a3a52; }
    a.button:focus-visible { outline: 2px solid #d4af37; outline-offset: 4px; }
  </style>
</head>

<body>
  <main>
    <p class="eyebrow">404</p>
    <h1>Cette page n'existe pas.</h1>
    <p>Le lien est peut-être ancien, ou il y a une coquille dans l'adresse.</p>
    <a class="button" href="/">Retour au CV</a>
    <div class="en" lang="en">
      <h1>This page doesn't exist.</h1>
      <p>The link may be outdated, or there's a typo in the address.</p>
      <a class="button" href="/en/">Back to the resume</a>
    </div>
  </main>
</body>

</html>
