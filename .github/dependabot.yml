version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Versions majeures traitées à la main, dans le plan (migration Astro, ESLint 10, TypeScript 7)
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      dependances:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
