<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="canonical" href="https://pannecoucke.me/" />
  <link rel="alternate" hreflang="fr" href="https://pannecoucke.me/" />
  <link rel="alternate" hreflang="en" href="https://pannecoucke.me/?lang=en" />
  <link rel="alternate" hreflang="x-default" href="https://pannecoucke.me/" />

  <!-- Thème appliqué avant le premier rendu (évite un flash clair si le mode sombre est mémorisé) -->
  <script>
    try { if (localStorage.getItem('resume-theme') === 'dark') document.documentElement.classList.add('dark') } catch (e) {}
  </script>

  <!-- Polices Geist et Geist Mono (Vercel) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="/images/profil.jpg" fetchpriority="high" />

  <!-- SEO (titre et description remplacés au build depuis resume-config) -->
  <title>François Pannecoucke · Product leader/builder | Transformation digitale</title>
  <meta name="description" content="" />
  <meta name="author" content="François Pannecoucke" />
  <meta name="theme-color" content="#f5f3ee" />

  <!-- Open Graph (LinkedIn, WhatsApp, iMessage, Slack…) -->
  <meta property="og:type" content="profile" />
  <meta property="og:url" content="https://pannecoucke.me/" />
  <meta property="og:title" content="François Pannecoucke · Product leader/builder | Transformation digitale" />
  <meta property="og:description"
    content="J'aide les équipes à livrer plus vite ce qui compte. 20 ans entre la banque, l'assurance et le produit. Fondateur de Hacktion, en mission chez Abeille Assurances." />
  <meta property="og:image" content="https://pannecoucke.me/images/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="1200" />
  <meta property="og:image:alt" content="François Pannecoucke, product leader/builder" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:locale:alternate" content="en_US" />
  <meta property="og:site_name" content="François Pannecoucke" />
  <meta property="profile:first_name" content="François" />
  <meta property="profile:last_name" content="Pannecoucke" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="François Pannecoucke · Product leader/builder | Transformation digitale" />
  <meta name="twitter:description"
    content="J'aide les équipes à livrer plus vite ce qui compte. 20 ans entre la banque, l'assurance et le produit. Fondateur de Hacktion, en mission chez Abeille Assurances." />
  <meta name="twitter:image" content="https://pannecoucke.me/images/og-image.jpg" />
  <meta name="twitter:image:alt" content="François Pannecoucke, product leader/builder" />
</head>

<body>
  <div id="root"></div>
  <!-- Remplacé au build par le CV complet en HTML sémantique (vite-plugin-resume-seo) -->
  <noscript>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
